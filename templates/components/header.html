<header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-[1360px] mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-14 sm:h-16 gap-4">
            <!-- Brand Logo -->
            <a href="/" class="flex items-center gap-2.5 focus:outline-none flex-shrink-0">
                <div class="w-8 h-8 rounded bg-slate-900 text-white flex items-center justify-center font-bold text-sm tracking-tighter">
                    <span class="text-orange-500 font-black">A</span>P
                </div>
                <div class="flex flex-col">
                    <span class="font-extrabold text-lg text-slate-900 leading-none tracking-tight">
                        AUTO<span class="text-orange-600">PARTS</span>
                    </span>
                    <span class="text-[9px] font-semibold text-slate-600 tracking-wider uppercase mt-0.5">OEM & Aftermarket</span>
                </div>
            </a>

            <!-- Navigation Links -->
            <nav class="hidden md:flex items-center gap-1 text-xs font-semibold text-slate-700">
                <a href="/catalog" class="px-3 py-1.5 rounded hover:bg-slate-100 hover:text-slate-900 transition-colors">
                    {{ t.nav_catalog }}
                </a>
                <a href="/cart" class="px-3 py-1.5 rounded hover:bg-slate-100 hover:text-slate-900 transition-colors flex items-center gap-1.5">
                    <span>{{ t.nav_cart }}</span>
                    <span class="cart-badge hidden px-1.5 py-0.2 rounded bg-orange-600 text-white text-[10px] font-bold">0</span>
                </a>
                <a href="/orders" class="px-3 py-1.5 rounded hover:bg-slate-100 hover:text-slate-900 transition-colors">
                    {{ t.nav_orders }}
                </a>
            </nav>

            <!-- Right: Auth & Lang -->
            <div class="flex items-center gap-3">
                <!-- Language Switcher -->
                <div class="flex items-center border border-slate-200 rounded text-xs overflow-hidden">
                    {% if lang == 'ru' %}
                        <a href="/set-lang?lang=en&redirect_to={{ request.url.path if request else '/' }}" class="px-2 py-1 text-slate-600 hover:bg-slate-50 font-bold" title="Switch to English">EN</a>
                    {% else %}
                        <a href="/set-lang?lang=ru&redirect_to={{ request.url.path if request else '/' }}" class="px-2 py-1 text-slate-600 hover:bg-slate-50 font-bold" title="Переключить на русский">RU</a>
                    {% endif %}
                </div>

                <!-- Desktop Auth Section -->
                <div id="auth-section" class="hidden sm:flex items-center">
                    <div class="w-16 h-7 rounded skeleton"></div>
                </div>

                <!-- Mobile Menu Button -->
                <button type="button" onclick="toggleMobileMenu()" class="md:hidden p-1.5 text-slate-600 hover:bg-slate-100 rounded" aria-label="Открыть меню">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Nav Dropdown -->
        <div id="mobile-nav" class="hidden md:hidden py-3 border-t border-slate-200 space-y-2 text-xs font-semibold">
            <a href="/catalog" class="block px-3 py-2 rounded hover:bg-slate-100">{{ t.nav_catalog }}</a>
            <a href="/cart" class="flex items-center justify-between px-3 py-2 rounded hover:bg-slate-100">
                <span>{{ t.nav_cart }}</span>
                <span class="cart-badge hidden px-1.5 py-0.5 rounded bg-orange-600 text-white text-[10px] font-bold">0</span>
            </a>
            <a href="/orders" class="block px-3 py-2 rounded hover:bg-slate-100">{{ t.nav_orders }}</a>
        </div>
    </div>
</header>
