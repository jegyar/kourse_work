{% extends "base.html" %}

{% block title %}{{ t.title_orders }} — AutoParts{% endblock %}

{% block content %}
<div class="space-y-5 max-w-4xl mx-auto">
    <!-- Breadcrumbs & Headline -->
    <div class="pb-3 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div>
            <nav class="flex items-center gap-1.5 text-xs text-slate-500 mb-1" aria-label="Breadcrumbs">
                <a href="/" class="hover:text-slate-800">{{ t.orders_breadcrumb_home }}</a>
                <span>/</span>
                <span class="text-slate-800 font-semibold">{{ t.orders_breadcrumb }}</span>
            </nav>
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
                <span>{{ t.orders_h1 }}</span>
                <span id="ordersCountBadge" class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-200 text-slate-700">0</span>
            </h1>
        </div>
    </div>

    <!-- Orders Container -->
    <div id="ordersContainer" class="space-y-3">
        <div class="p-6 bg-white border border-slate-200 rounded text-center text-xs text-slate-400">
            {{ t.orders_loading }}
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const _t = {
    loginRequired: "{{ t.orders_login_required }}",
    loginBtn: "{{ t.orders_login_btn }}",
    error: "{{ t.orders_error }}",
    emptyTitle: "{{ t.orders_empty_title }}",
    emptyDesc: "{{ t.orders_empty_desc }}",
    toCatalog: "{{ t.orders_to_catalog }}",
    order: "{{ t.orders_order }}",
    spec: "{{ t.orders_spec }}",
    specLoading: "{{ t.orders_spec_loading }}",
    specError: "{{ t.orders_spec_error }}",
    connError: "{{ t.orders_conn_error }}",
    delivery: "{{ t.orders_delivery }}"
};

const statusMap = {
    'new': ["{{ t.orders_status_new }}", 'status-new'],
    'confirmed': ["{{ t.orders_status_confirmed }}", 'status-confirmed'],
    'processing': ["{{ t.orders_status_processing }}", 'status-processing'],
    'shipped': ["{{ t.orders_status_shipped }}", 'status-shipped'],
    'delivered': ["{{ t.orders_status_delivered }}", 'status-delivered'],
    'cancelled': ["{{ t.orders_status_cancelled }}", 'status-cancelled']
};

document.addEventListener('DOMContentLoaded', async () => {
    const token = getToken();
    const container = document.getElementById('ordersContainer');

    if (!token) {
        if (container) {
            container.innerHTML = `
                <div class="p-8 text-center bg-white border border-slate-200 rounded space-y-3">
                    <p class="text-sm font-semibold text-slate-800">${_t.loginRequired}</p>
                    <div class="pt-1">
                        <a href="/login" class="px-4 py-2 bg-slate-900 text-white rounded text-xs font-semibold inline-block">${_t.loginBtn}</a>
                    </div>
                </div>
            `;
        }
        return;
    }

    try {
        const resp = await apiRequest('/orders_api/');
        if (resp && resp.ok) {
            const orders = await resp.json();
            renderOrders(orders);
        }
    } catch (e) {
        if (container) {
            container.innerHTML = `
                <div class="p-4 text-center text-xs text-rose-600 bg-rose-50 border border-rose-200 rounded">
                    ${_t.error}
                </div>
            `;
        }
    }
});

function renderOrders(orders) {
    const container = document.getElementById('ordersContainer');
    const badge = document.getElementById('ordersCountBadge');
    if (!container) return;

    if (badge) badge.textContent = orders.length;

    if (!orders || orders.length === 0) {
        container.innerHTML = `
            <div class="part-card py-12 px-4 text-center space-y-3">
                <p class="text-sm font-semibold text-slate-800">${_t.emptyTitle}</p>
                <p class="text-xs text-slate-500">${_t.emptyDesc}</p>
                <div class="pt-1">
                    <a href="/catalog" class="px-4 py-2 bg-slate-900 text-white rounded text-xs font-semibold inline-block">${_t.toCatalog}</a>
                </div>
            </div>
        `;
        return;
    }

    let html = '';
    orders.forEach(o => {
        const date = new Date(o.created_at).toLocaleString('{{ lang }}-{{ lang|upper }}', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
        const statusInfo = statusMap[o.status] || [o.status, 'status-new'];
        const [rub, kop] = o.total_amount.toFixed(2).split('.');

        html += `
        <div class="part-card p-4 space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-slate-100">
                <div class="flex items-center gap-3">
                    <span class="font-bold text-sm text-slate-900">${_t.order}${o.order_id}</span>
                    <span class="text-xs text-slate-400">${date}</span>
                </div>

                <div class="flex items-center gap-4">
                    <span class="status-pill ${statusInfo[1]}">${statusInfo[0]}</span>
                    <div class="text-right">
                        <span class="text-sm font-extrabold text-slate-900">${rub}</span><span class="text-xs font-semibold text-slate-500">,${kop}</span>
                        <span class="text-xs font-bold text-slate-700 ml-0.5">${o.currency || 'BYN'}</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between text-xs">
                <button type="button" onclick="toggleDetails(${o.order_id})" class="text-orange-600 hover:text-orange-700 font-semibold flex items-center gap-1" id="btn-toggle-${o.order_id}">
                    <span>${_t.spec}</span>
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </button>
            </div>

            <div id="details-${o.order_id}" class="hidden pt-2 border-t border-slate-100 text-xs text-slate-600">
                ${_t.specLoading}
            </div>
        </div>
        `;
    });

    container.innerHTML = html;
}

async function toggleDetails(orderId) {
    const detailsDiv = document.getElementById(`details-${orderId}`);
    if (!detailsDiv) return;

    if (!detailsDiv.classList.contains('hidden')) {
        detailsDiv.classList.add('hidden');
        return;
    }

    detailsDiv.classList.remove('hidden');

    try {
        const resp = await apiRequest(`/orders_api/${orderId}`);
        if (resp && resp.ok) {
            const order = await resp.json();
            let itemsHtml = `
                <div class="bg-slate-50 border border-slate-200 rounded p-3 space-y-1.5 divide-y divide-slate-200/60">
            `;
            order.items.forEach(i => {
                const [r, k] = (i.quantity * i.unit_price).toFixed(2).split('.');
                itemsHtml += `
                    <div class="pt-1.5 first:pt-0 flex items-center justify-between">
                        <div class="truncate pr-2">
                            <span class="font-medium text-slate-800">${i.name}</span>
                            <span class="text-slate-400 ml-1">(${i.quantity} × ${i.unit_price.toFixed(2)} BYN)</span>
                        </div>
                        <div class="font-bold text-slate-900 whitespace-nowrap">
                            ${r},${k} BYN
                        </div>
                    </div>
                `;
            });
            itemsHtml += '</div>';

            if (order.delivery_address) {
                itemsHtml += `
                    <div class="mt-2 text-[11px] text-slate-500">
                        ${_t.delivery} <span class="font-medium text-slate-700">${order.delivery_address}</span>
                    </div>
                `;
            }

            detailsDiv.innerHTML = itemsHtml;
        } else {
            detailsDiv.innerHTML = `<span class="text-rose-600 font-medium">${_t.specError}</span>`;
        }
    } catch (e) {
        detailsDiv.innerHTML = `<span class="text-rose-600 font-medium">${_t.connError}</span>`;
    }
}
</script>
{% endblock %}
