<!DOCTYPE html>
<html lang="{{ lang or 'ru' }}" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ t.title_index if t else 'AutoParts — Каталог автозапчастей' }}{% endblock %}</title>
    <meta name="description" content="Информационная система подбора и заказа автозапчастей. Оригинальные каталоги, кросс-номера, наличие на складе.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20%220%22%20%22100%22%20%22100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
    
    <!-- Google Fonts: Inter (Technical & Clean) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (Light Industrial Automotive Theme) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    borderRadius: {
                        DEFAULT: '6px',
                        none: '0',
                        sm: '4px',
                        md: '6px',
                        lg: '8px',
                        xl: '10px',
                    },
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            DEFAULT: '#ea580c',
                        },
                        steel: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    },
                    boxShadow: {
                        'subtle': '0 1px 2px 0 rgba(0, 0, 0, 0.04)',
                        'card': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05)',
                        'card-hover': '0 4px 12px 0 rgba(0, 0, 0, 0.06)',
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_css %}{% endblock %}
</head>
<body class="h-full flex flex-col bg-slate-100 text-slate-800 antialiased font-sans text-sm selection:bg-orange-100 selection:text-orange-900">
    <!-- Header -->
    {% include "components/header.html" %}

    <!-- Main Container -->
    <main class="flex-grow w-full max-w-[1360px] mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none" aria-live="polite"></div>

    <!-- Footer -->
    {% include "components/footer.html" %}

    <!-- Core Scripts -->
    <script src="/static/js/part-icons.js?v=1.2"></script>
    <script src="/static/js/main.js?v=1.2"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
