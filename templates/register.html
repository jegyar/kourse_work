{% extends "base.html" %}

{% block title %}Регистрация — AutoParts{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
    <div class="bg-white border border-slate-300 rounded p-6 shadow-subtle space-y-5">
        <div class="pb-3 border-b border-slate-100">
            <h1 class="text-lg font-bold text-slate-900">Регистрация в системе</h1>
            <p class="text-xs text-slate-500 mt-0.5">Создание профиля для оформления заказов и сохранения истории</p>
        </div>

        <form id="registerForm" class="space-y-3">
            <div class="grid grid-cols-2 gap-2.5">
                <div>
                    <label for="first_name" class="block text-xs font-semibold text-slate-700 mb-1">Имя</label>
                    <input type="text" id="first_name" required placeholder="Иван" class="w-full h-9 px-3 text-xs border border-slate-300 rounded focus:outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-800">
                </div>
                <div>
                    <label for="last_name" class="block text-xs font-semibold text-slate-700 mb-1">Фамилия</label>
                    <input type="text" id="last_name" required placeholder="Иванов" class="w-full h-9 px-3 text-xs border border-slate-300 rounded focus:outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-800">
                </div>
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Электронная почта</label>
                <input type="email" id="email" required placeholder="name@company.by" class="w-full h-9 px-3 text-xs border border-slate-300 rounded focus:outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-800">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 mb-1">Пароль (мин. 6 символов)</label>
                <input type="password" id="password" required minlength="6" class="w-full h-9 px-3 text-xs border border-slate-300 rounded focus:outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-800">
            </div>

            <button type="submit" id="registerBtn" class="w-full h-9 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded transition-colors mt-2">
                Зарегистрировать профиль
            </button>
        </form>

        <div class="pt-3 border-t border-slate-100 text-center text-xs text-slate-500">
            Уже зарегистрированы?
            <a href="/login" class="font-semibold text-orange-600 hover:underline ml-1">
                Войти
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.textContent = 'Создание учетной записи...';

    const payload = {
        first_name: document.getElementById('first_name').value.trim(),
        last_name: document.getElementById('last_name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
    };

    try {
        const response = await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            showNotification('Регистрация завершена! Входим...', 'success');

            const loginData = new URLSearchParams();
            loginData.append('username', payload.email);
            loginData.append('password', payload.password);

            const loginResp = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: loginData.toString()
            });

            if (loginResp.ok) {
                const data = await loginResp.json();
                setToken(data.access_token);
                setTimeout(() => window.location.href = '/', 800);
            } else {
                setTimeout(() => window.location.href = '/login', 800);
            }
        } else {
            const error = await response.json();
            showNotification(error.detail || 'Ошибка регистрации', 'error');
            btn.disabled = false;
            btn.textContent = 'Зарегистрировать профиль';
        }
    } catch (error) {
        showNotification('Ошибка связи с сервером', 'error');
        btn.disabled = false;
        btn.textContent = 'Зарегистрировать профиль';
    }
});
</script>
{% endblock %}
